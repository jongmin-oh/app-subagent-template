AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  GoogleWebClientId:
    Type: String
    Default: ''
    Description: Google OAuth Web Client ID (ID 토큰 aud 검증용)

Globals:
  Function:
    Runtime: python3.13
    Timeout: 60
    MemorySize: 1024
    Architectures:
      - arm64

Resources:
  LambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: backend-template
      Handler: main.lambda_handler
      CodeUri: .
      Environment:
        Variables:
          TZ: Asia/Seoul
          DSQL_ENDPOINT: !GetAtt DsqlCluster.Endpoint
          GOOGLE_WEB_CLIENT_ID: !Ref GoogleWebClientId
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/backend-template/JWT_SECRET'
            - Effect: Allow
              Action: kms:Decrypt
              Resource: '*'
              Condition:
                StringEquals:
                  kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn

      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ['*']
          AllowMethods: ['*']
          AllowHeaders: ['*']

  DsqlCluster:
    Type: AWS::DSQL::Cluster
    Properties:
      DeletionProtectionEnabled: false


Outputs:
  FunctionUrl:
    Description: Invoke URL for backend-template
    Value: !GetAtt LambdaFunctionUrl.FunctionUrl
  DsqlClusterIdentifier:
    Description: Aurora DSQL cluster identifier
    Value: !GetAtt DsqlCluster.Identifier
  DsqlEndpoint:
    Description: Aurora DSQL cluster endpoint
    Value: !GetAtt DsqlCluster.Endpoint
